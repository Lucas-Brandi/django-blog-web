services:
  web:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules # mantém o node_modules do container
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  web-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    ports:
      - '8080:80'
