name: django-blog-web

services:
  # Desenvolvimento: docker compose up --build
  web:
    build:
      context: .
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      HUSKY: "0"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - type: bind
        source: .
        target: /app
      # node_modules do container fica em volume nomeado (não mistura com o do host)
      - node_modules:/app/node_modules
    # npm install na subida mantém as dependências em dia sem precisar recriar volumes
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

  # Produção local (nginx): docker compose --profile prod up --build web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${PROD_PORT:-8080}:80"

volumes:
  node_modules: